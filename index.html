<script>
  /* =====================================================================
     EINSTELLUNGEN: nur diese zwei Werte anpassen
     RSVP_URL    : Web-App-URL aus Google Apps Script (endet auf /exec)
     ACCESS_CODE : Zugangscodes für die Seite, als Liste, z. B. ["love2027", "hochzeit2027"].
                   Gross-/Kleinschreibung spielt keine Rolle.
                   Leer lassen ("") = Seite ohne Code erreichbar.
     ===================================================================== */
  const CONFIG = {
    RSVP_URL: "",
    ACCESS_CODE: ["love2027", "wedding2027", "ljubav2027", "svadba2027", "liebe2027", "hochzeit2027"],
    INVITE: "einzel"        // Art der Einladung: "einzel" (1 Person), "paar" (bis 2), "familie" (bis 6)
  };

  // Zugangscode: wird bei jedem Besuch abgefragt
  if ([].concat(CONFIG.ACCESS_CODE).filter(Boolean).length) document.documentElement.classList.add("locked");

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Great+Vibes&family=Jost:wght@300;400;500&family=Noto+Sans+Syriac:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf6ef;
    --paper: #fffdf9;
    --ink: #1f2724;
    --muted: #47524d;
    --sage: #7f9a88;
    --sage-dark: #4a6354;
    --gold: #b89a5e;
    --gold-text: #8a6d35;   /* dunkleres Gold für Schrift */
    --line: #e6dccb;
    --serif: "Cormorant Garamond", Georgia, serif;
    --script: "Great Vibes", cursive;
    --sans: "Jost", system-ui, sans-serif;
  }
  /* Aramäisch (syrische Schrift) */
  html[lang="syr"] {
    --serif: "Noto Sans Syriac", "Cormorant Garamond", serif;
    --sans: "Noto Sans Syriac", "Jost", sans-serif;
  }
  html[lang="syr"] .script { font-family: "Noto Sans Syriac", serif !important; font-size: 1.9rem !important; line-height: 1.6 !important; }
  html[lang="syr"] body { line-height: 2; }
  html[lang="syr"] nav, html[lang="syr"] label, html[lang="syr"] .btn, html[lang="syr"] .eyebrow,
  html[lang="syr"] .countdown small { letter-spacing: 0; text-transform: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 1.06rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- Navigation ---------- */
  nav {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    display: flex; justify-content: center; align-items: center; gap: 1.8rem; flex-wrap: wrap;
    padding: .9rem 1rem;
    background: rgba(250, 246, 239, 0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    font-size: 0.86rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
  }
  nav a { text-decoration: none; color: var(--muted); transition: color .2s; }
  nav a:hover { color: var(--sage-dark); }
  .lang-switch { display: flex; gap: .3rem; padding-inline-start: 1.2rem; border-inline-start: 1px solid var(--line); }
  .lang-switch button {
    background: none; border: 1px solid transparent; border-radius: 999px;
    padding: .2rem .6rem; cursor: pointer; color: var(--muted);
    font-family: "Jost", "Noto Sans Syriac", sans-serif; font-size: .78rem; letter-spacing: .08em;
  }
  .lang-switch button[aria-pressed="true"] { border-color: var(--sage-dark); color: var(--sage-dark); }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 100vh; display: grid; place-items: center; text-align: center;
    padding: 7rem 1.5rem 4rem; position: relative; overflow: hidden;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(127,154,136,.18), transparent 70%);
    width: 520px; height: 520px;
  }
  .hero::before { top: -160px; left: -160px; }
  .hero::after  { bottom: -180px; right: -160px; background: radial-gradient(circle, rgba(184,154,94,.16), transparent 70%); }
  .hero-inner { position: relative; z-index: 1; max-width: 720px; }
  .eyebrow { font-size: 0.92rem; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--sage-dark); margin-bottom: 1.5rem; }
  .names {
    font-family: "Great Vibes", cursive;
    font-size: clamp(3.2rem, 11.5vw, 7rem);
    line-height: 1.1; font-weight: 400; color: var(--ink);
    direction: ltr; unicode-bidi: isolate;
  }
  .names .amp { color: var(--gold-text); font-size: .7em; display: inline-block; margin: 0 .15em; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 2rem auto; color: var(--gold); }
  .divider::before, .divider::after { content: ""; height: 1px; width: 70px; background: var(--gold); opacity: .6; }
  .date-line { font-family: var(--serif); font-size: clamp(1.3rem, 4vw, 1.75rem); letter-spacing: .06em; }
  .place-line { color: var(--muted); margin-top: .3rem; letter-spacing: .03em; font-size: 1.08rem; }

  .countdown { display: flex; justify-content: center; gap: clamp(.75rem, 4vw, 2rem); margin-top: 3rem; direction: ltr; }
  .countdown div { min-width: 64px; }
  .countdown span { display: block; font-family: "Cormorant Garamond", serif; font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 500; line-height: 1; }
  .countdown small { font-size: .8rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .btn {
    display: inline-block; margin-top: 3rem; padding: .9rem 2.4rem;
    border: 1px solid var(--sage-dark); border-radius: 999px;
    color: var(--sage-dark); text-decoration: none;
    font-size: .9rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    background: transparent; cursor: pointer; font-family: var(--sans); transition: all .25s;
  }
  .btn:hover, .btn.solid { background: var(--sage-dark); color: #fff; }
  .btn.solid:hover { background: var(--ink); border-color: var(--ink); }

  /* ---------- Sections ---------- */
  section.block { padding: 6rem 1.5rem; }
  section.alt { background: var(--paper); border-block: 1px solid var(--line); }
  .container { max-width: 960px; margin: 0 auto; }
  .section-title { text-align: center; margin-bottom: 3.5rem; }
  .section-title .script { font-family: var(--script); font-size: 2.9rem; color: var(--gold-text); line-height: 1.15; }
  .section-title h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: .04em; }
  .lead { font-family: var(--serif); font-size: 1.55rem; font-weight: 500; font-style: italic; text-align: center; max-width: 640px; margin: 0 auto; }
  html[lang="syr"] .lead { font-style: normal; font-size: 1.25rem; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; max-width: 640px; margin: 0 auto; }
  .timeline::before { content: ""; position: absolute; inset-inline-start: 92px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .event { display: grid; grid-template-columns: 80px 1fr; gap: 2.5rem; padding: 1.1rem 0; position: relative; }
  .event::before {
    content: ""; position: absolute; inset-inline-start: 88px; top: 1.65rem;
    width: 9px; height: 9px; border-radius: 50%; background: var(--cream); border: 1px solid var(--gold);
  }
  .event time { font-family: "Cormorant Garamond", serif; font-size: 1.35rem; font-weight: 600; text-align: end; color: var(--sage-dark); }
  .event h3 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; }
  .event p { color: var(--muted); font-size: 1.04rem; }

  /* ---------- Cards ---------- */
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
  .cards > .card { flex: 1 1 260px; max-width: 304px; }
  .card { background: var(--cream); border: 1px solid var(--line); border-radius: 4px; padding: 2.2rem 1.8rem; text-align: center; }
  .card .icon { font-size: 1.6rem; color: var(--gold); margin-bottom: .8rem; height: 2rem; display: flex; align-items: center; justify-content: center; }
  .ico { width: 1.7rem; height: 1.7rem; display: block; }
  .card h3 { font-family: var(--serif); font-weight: 600; font-size: 1.55rem; margin-bottom: .5rem; }
  .card p { color: var(--muted); font-size: 1.04rem; }
  .card a.link { display: inline-block; margin-top: 1rem; color: var(--sage-dark); font-size: .9rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid currentColor; }
  html[lang="syr"] .card a.link { letter-spacing: 0; }

  /* ---------- RSVP ---------- */
  form { max-width: 560px; margin: 0 auto; display: grid; gap: 1.3rem; }
  label { font-size: .84rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: .4rem; }
  input, select, textarea {
    width: 100%; padding: .85rem 1rem;
    font-family: var(--sans); font-size: 1.05rem; font-weight: 400; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 3px; transition: border-color .2s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sage); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .choice { display: flex; gap: 1rem; }
  .choice label {
    flex: 1; text-transform: none; letter-spacing: 0; font-size: 1rem; color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: .85rem 1rem;
    display: flex; align-items: center; gap: .6rem; cursor: pointer; margin: 0; background: var(--paper);
  }
  .choice input { width: auto; accent-color: var(--sage-dark); }
  .hint { font-size: .95rem; color: var(--muted); margin-top: .35rem; }
  .center { text-align: center; }
  .thanks { display: none; text-align: center; max-width: 520px; margin: 0 auto; padding: 3rem 2rem; border: 1px solid var(--line); background: var(--paper); }
  .thanks .script { font-family: var(--script); font-size: 3rem; color: var(--gold-text); }
  .deadline { text-align: center; color: var(--muted); margin-top: -2rem; margin-bottom: 2.5rem; }
  #attend-details, #guests { display: grid; gap: 1.3rem; }

  /* ---------- Foto ---------- */
  .photo { max-width: 400px; margin: 0 auto 3rem; padding: 10px; background: var(--cream); border: 1px solid var(--line);
           border-radius: 210px 210px 8px 8px; box-shadow: 0 18px 40px -24px rgba(47,58,54,.35); }
  .photo img { display: block; width: 100%; height: auto; border-radius: 200px 200px 4px 4px; }

  /* ---------- Mitwirkende ---------- */
  .times-note { text-align: center; color: var(--muted); font-size: .98rem; margin-top: 1.5rem; }
  .crew-title { margin-top: 5rem; }
  .crew .card { background: var(--paper); }
  .hp { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; opacity: 0; pointer-events: none; }
  form { position: relative; }
  .form-error { display: none; text-align: center; color: #a5483a; font-size: .95rem; }
  .btn[disabled] { opacity: .6; cursor: wait; }

  /* ---------- Zugangscode ---------- */
  .gate { display: none; position: fixed; inset: 0; z-index: 100; overflow-y: auto; text-align: center;
          background: radial-gradient(circle at 50% 38%, #fffdf9, #f4ecdf 72%); }
  html.locked .gate, .gate.opening { display: grid; }
  html.locked body > :not(.gate) { display: none !important; }
  .gate-box { max-width: 400px; width: 100%; margin: auto; padding: 2.5rem 1.5rem; display: grid; justify-items: center; }
  .seal { --seal: min(74vw, 300px); display: grid; place-items: center; width: var(--seal); aspect-ratio: 1; }
  .seal svg { grid-area: 1 / 1; width: 100%; height: 100%; overflow: visible; }
  .seal circle { fill: none; stroke: var(--gold); stroke-width: 1.1; }
  .seal circle.in { stroke-width: .45; opacity: .75; }
  .seal circle.glow { stroke: none; fill: url(#sealGlow); }
  .seal .star { fill: var(--gold); }
  .seal .mono { grid-area: 1 / 1; font-family: "Great Vibes", cursive; font-size: calc(var(--seal) * .225); line-height: 1; color: var(--ink);
    direction: ltr; white-space: nowrap; padding-top: .08em; }
  .seal .mono span { color: var(--gold-text); font-size: .62em; margin: 0 .08em; }
  .gate-date { font-family: "Cormorant Garamond", serif; font-weight: 500; letter-spacing: .26em; font-size: clamp(1.35rem, 5.4vw, 1.7rem);
    color: var(--ink); margin-top: 1.9rem; direction: ltr; padding-inline-start: .26em; }
  .gate-form-wrap { width: 100%; margin-top: 2.4rem; }
  .gate p { color: var(--muted); margin-bottom: 1.1rem; }
  .gate form { gap: 0; }
  .gate input { text-align: center; letter-spacing: .12em; background: rgba(255,253,249,.8); }
  .gate .btn { margin-top: 1.2rem; }
  .gate-error { color: #a5483a; font-size: .95rem; margin-top: .8rem; min-height: 1.5em; }
  .gate .lang-switch { justify-content: center; border: 0; padding: 0; margin-top: 1.6rem; }

  /* ---------- FAQ ---------- */
  details { border-bottom: 1px solid var(--line); padding: 1.2rem 0; max-width: 700px; margin: 0 auto; }
  summary { font-family: var(--serif); font-weight: 600; font-size: 1.4rem; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--gold-text); font-size: 1.6rem; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { color: var(--muted); padding-top: .6rem; }

  /* ---------- Footer ---------- */
  footer { text-align: center; padding: 4rem 1.5rem; }
  footer .names { font-size: 3rem; }
  footer p { color: var(--muted); font-size: .95rem; letter-spacing: .15em; margin-top: .5rem; direction: ltr; }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  @media (max-width: 640px) {
    nav { gap: .9rem; font-size: .74rem; letter-spacing: .08em; }
    .lang-switch { padding-inline-start: 0; border-inline-start: 0; width: 100%; justify-content: center; }
    .hero { padding-top: 8.5rem; }
    .row { grid-template-columns: 1fr; }
    .cards > .card { max-width: none; }
    .choice { flex-direction: column; }
    .timeline::before { inset-inline-start: 66px; }
    .event { grid-template-columns: 56px 1fr; gap: 2rem; }
    .event::before { inset-inline-start: 62px; }
    .event time { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
<style id="fable">
/* ===== Fable-Schicht: Einstieg mit Kreis, Foto im Startbereich, feine Bewegung ===== */
/* Einstieg: Kreis zeichnet sich, Monogramm und Datum erscheinen, dann das Passwort-Feld */
html.fable-js .seal circle:not(.glow) { stroke-dasharray: 1; stroke-dashoffset: 1; transform: rotate(-90deg); transform-origin: 50% 50%;
  animation: fDraw 1.5s cubic-bezier(.6,0,.2,1) .2s forwards; }
html.fable-js .seal circle.glow { opacity: 0; animation: fFade 1.6s .5s ease forwards; }
html.fable-js .seal .star { opacity: 0; transform: scale(.3); transform-box: fill-box; transform-origin: center; animation: fMono .8s 1.5s ease forwards; }
html.fable-js .seal circle.in { animation-delay: .45s; }
html.fable-js .seal .mono { opacity: 0; transform: scale(.92); animation: fMono 1.1s .9s ease forwards; }
html.fable-js .gate-date { opacity: 0; animation: fFade .9s 1.4s ease forwards; }
html.fable-js .gate-form-wrap { opacity: 0; transform: translateY(14px); animation: fRise 1s 1.9s cubic-bezier(.2,.7,.2,1) forwards; }
@keyframes fDraw { to { stroke-dashoffset: 0; } }
@keyframes fMono { to { opacity: 1; transform: none; } }
@keyframes fFade { to { opacity: 1; } }
@keyframes fRise { to { opacity: 1; transform: none; } }
/* Falscher Code: Feld schüttelt sich kurz */
.gate input.wrong { animation: fShake .45s ease; border-color: #a5483a; }
@keyframes fShake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
/* Richtiger Code: Formular verschwindet, Kreis bleibt kurz stehen, dann öffnet sich die Seite nach oben */
.gate.opening .gate-form-wrap { animation: none; opacity: 0; transform: translateY(10px); transition: opacity .5s ease, transform .5s ease; }
.gate.opening .seal { transition: transform 1.1s cubic-bezier(.2,.7,.2,1); transform: scale(1.06); }
.gate.out { transform: translateY(-100%); opacity: 0; pointer-events: none;
  transition: transform 1.2s cubic-bezier(.7,0,.2,1), opacity 1.2s ease; }

/* Lesefortschritt */
.f-progress { position: fixed; top: 0; left: 0; right: 0; height: 2px; z-index: 20; background: linear-gradient(90deg, var(--gold), #e2cf9f); transform-origin: 0 50%; transform: scaleX(0); }
html[dir="rtl"] .f-progress { transform-origin: 100% 50%; }

/* ---------- Startbereich mit Foto ---------- */
.hero { gap: 2.2rem; }
.hero::before { animation: fDrift 26s ease-in-out infinite alternate; }
.hero::after  { animation: fDrift 32s ease-in-out infinite alternate-reverse; }
@keyframes fDrift { to { transform: translate(60px, 40px) scale(1.15); } }
.hero .petals { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.hero .photo { position: relative; z-index: 1; margin: 0 auto; width: 100%; max-width: 250px; }
.hero .photo::after { content: ""; position: absolute; inset: -12px; border: 1px solid var(--gold); border-radius: 222px 222px 14px 14px; opacity: .55; pointer-events: none; }
.photo-clip { overflow: hidden; border-radius: 200px 200px 4px 4px; }
.photo-clip img { border-radius: 0; }
html.fable-go .photo-clip img { animation: fKen 14s ease-out forwards; }
@keyframes fKen { from { transform: scale(1.14); } to { transform: scale(1); } }
@media (min-width: 900px) {
  .hero { grid-template-columns: minmax(0, .9fr) minmax(0, 1.2fr); gap: 4.5rem; padding-inline: max(3rem, calc((100vw - 1180px) / 2)); }
  .hero .photo { max-width: 400px; justify-self: end; margin: 0; }
  .hero-inner { justify-self: start; }
}
@media (max-width: 640px) { .hero { padding-top: 8rem; } }

/* Auftritt nach der Eröffnung */
html.fable-js .hero .photo, html.fable-js .hero .eyebrow, html.fable-js .hero .divider, html.fable-js .hero .date-line,
html.fable-js .hero .place-line, html.fable-js .hero .countdown, html.fable-js .hero .btn {
  opacity: 0; transform: translateY(18px); transition: opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1); }
html.fable-js .hero .photo { transform: translateY(26px) scale(.96); transition-duration: 1.6s; }
html.fable-js .hero .names { clip-path: inset(-25% 100% -25% -5%); transition: clip-path 1.9s cubic-bezier(.6,0,.2,1) .35s; }
html.fable-go .hero .photo, html.fable-go .hero .eyebrow, html.fable-go .hero .divider, html.fable-go .hero .date-line,
html.fable-go .hero .place-line, html.fable-go .hero .countdown, html.fable-go .hero .btn { opacity: 1; transform: none; }
html.fable-go .hero .names { clip-path: inset(-25% -5% -25% -5%); }
html.fable-go .hero .eyebrow { transition-delay: .2s; }
html.fable-go .hero .divider { transition-delay: 1.5s; }
html.fable-go .hero .date-line { transition-delay: 1.75s; }
html.fable-go .hero .place-line { transition-delay: 1.95s; }
html.fable-go .hero .countdown { transition-delay: 2.25s; }
html.fable-go .hero .btn { transition-delay: 2.6s; }

/* ---------- Zweig-Ornament & Überschriften ---------- */
.sprig { display: block; width: 120px; height: 26px; margin: 0 auto 1rem; overflow: visible; }
.sprig path { fill: none; stroke: var(--gold); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; }
html.fable-js .sprig path { stroke-dasharray: 1; stroke-dashoffset: 1; transition: stroke-dashoffset 1.6s ease .15s; }
html.fable-js .sprig path.leaf { transition-delay: .7s; }
html.fable-js .reveal.visible .sprig path { stroke-dashoffset: 0; }
html.fable-js .reveal .section-title .script { clip-path: inset(-30% 100% -30% -5%); transition: clip-path 1.5s cubic-bezier(.6,0,.2,1) .45s; }
html.fable-js .reveal.visible .section-title .script { clip-path: inset(-30% -5% -30% -5%); }

/* ---------- Ablauf: goldene Linie wächst beim Scrollen ---------- */
.timeline-progress { position: absolute; inset-inline-start: 92px; top: 6px; bottom: 6px; width: 1px; background: var(--gold-text); transform-origin: 50% 0; transform: scaleY(0); }
.event::before { transition: background .5s ease, transform .5s ease; }
.event.passed::before { background: var(--gold); transform: scale(1.25); }
@media (max-width: 640px) { .timeline-progress { inset-inline-start: 66px; } }

/* ---------- Kacheln ---------- */
@media (hover: hover) {
  .card { transition: transform .6s cubic-bezier(.2,.7,.2,1), box-shadow .6s ease, border-color .6s ease; }
  .card:hover { transform: translateY(-6px); box-shadow: 0 26px 44px -30px rgba(31,39,36,.4); border-color: var(--gold); }
}
.f-burst { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
</style>
<script>
  // Animationen nur, wenn das Gerät sie nicht reduziert haben möchte
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    document.documentElement.classList.add("fable-js");
    setTimeout(function () { var h = document.documentElement; if (!h.classList.contains("locked")) h.classList.add("fable-go"); }, 9000); // Sicherheitsnetz
  }
</script>

    q1: "ܡܨܐ ܐܢܐ ܕܐܝܬܐ ܒܪ ܠܘܝܐ؟",
    a1: "ܩܪܝܬܐ ܗܕܐ ܠܟ ܒܠܚܘܕ ܗܝ. ܬܘܕܝ ܥܠ ܦܘܪܫܢܟ."
  });
}
(function () {
  const sel = document.getElementById("personen");
  sel.innerHTML = "";
  for (let i = 1; i <= INVITE_MAX; i++) sel.add(new Option(String(i), String(i)));
  if (INVITE_MAX === 1) {                                     // Einzelperson: keine Auswahl nötig
    const box = sel.parentElement; box.style.display = "none";
    box.parentElement.style.gridTemplateColumns = "1fr";
  }
})();

const META = { de: { lang: "de", dir: "ltr" }, sr: { lang: "sr-Cyrl", dir: "ltr" }, syr: { lang: "syr", dir: "rtl" } };
let current = "de";

function setLang(code) {
  if (!T[code]) code = "de";
  current = code;
  const dict = T[code];
  document.documentElement.lang = META[code].lang === "syr" ? "syr" : META[code].lang;
  document.documentElement.dir = META[code].dir;
  document.title = dict._title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = dict[el.dataset.i18n];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll(".lang-switch button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === code ? "true" : "false"));
  renderGuests();
  try {
    const url = new URL(location.href);
    url.searchParams.set("lang", code);
    history.replaceState(null, "", url);
  } catch (e) {}
}

document.querySelectorAll(".lang-switch button").forEach(b =>
  b.addEventListener("click", () => setLang(b.dataset.lang)));

// Sprache aus Link übernehmen, z. B. ...?lang=sr oder ?lang=syr
let initial = "de";
try { initial = new URLSearchParams(location.search).get("lang") || "de"; } catch (e) {}
setLang(initial);

// Countdown bis zur Trauung
const target = new Date("2027-08-21T14:00:00+02:00").getTime();
const pad = n => String(n).padStart(2, "0");
function tick() {
  let diff = Math.max(0, target - Date.now());
  const d = Math.floor(diff / 86400000); diff %= 86400000;
  const h = Math.floor(diff / 3600000);  diff %= 3600000;
  const m = Math.floor(diff / 60000);    diff %= 60000;
  const s = Math.floor(diff / 1000);
  document.getElementById("cd-days").textContent = d;
  document.getElementById("cd-hours").textContent = pad(h);
  document.getElementById("cd-mins").textContent = pad(m);
  document.getElementById("cd-secs").textContent = pad(s);
}
tick(); setInterval(tick, 1000);

// Zugangscode-Formular
document.getElementById("gate-form").addEventListener("submit", e => {
  e.preventDefault();
  const norm = s => String(s || "").trim().toLowerCase();
  const input = document.getElementById("gate-code");
  const gate = document.getElementById("gate"), root = document.documentElement;
  if ([].concat(CONFIG.ACCESS_CODE).map(norm).filter(Boolean).includes(norm(input.value))) {
    input.blur();
    document.getElementById("gate-error").textContent = "";
    if (!root.classList.contains("fable-js")) {            // ohne Animationen: sofort öffnen
      root.classList.remove("locked"); window.scrollTo(0, 0); return;
    }
    gate.classList.add("opening");                          // Formular blendet aus, Kreis bleibt stehen
    setTimeout(() => {
      root.classList.remove("locked");                      // Seite liegt jetzt unter dem Einstieg bereit
      window.scrollTo(0, 0);
      gate.classList.add("out");                            // Einstieg gleitet nach oben weg
    }, 900);
    setTimeout(() => { gate.classList.remove("opening", "out"); }, 2300);
  } else {
    document.getElementById("gate-error").textContent = T[current].gate_wrong;
    input.classList.remove("wrong"); void input.offsetWidth; input.classList.add("wrong");
    input.select();
  }
});

// ---------- Zusage-Formular ----------
const MAX_PERSONS = 6;
const form = document.getElementById("rsvp-form");
const errEl = document.getElementById("form-error");

// Erzeugt Name- und Menüfelder für Person 2 bis N (bleibt beim Sprachwechsel erhalten)
function renderGuests() {
  const f = document.getElementById("rsvp-form");
  const box = document.getElementById("guests");
  const dict = T[current];
  const attends = f.elements.teilnahme.value !== "nein";
  document.getElementById("attend-details").style.display = attends ? "" : "none";
  const n = attends ? parseInt(f.elements.personen.value, 10) : 1;

  const saved = {};
  box.querySelectorAll("input, select").forEach(el => { saved[el.name] = el.value; });
  box.innerHTML = "";
  const menus = [["Fleisch", "m_meat"], ["Fisch", "m_fish"], ["Vegetarisch", "m_veg"], ["Vegan", "m_vegan"]];

  for (let i = 2; i <= n; i++) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      `<div><label for="name${i}"></label><input id="name${i}" name="name${i}" required></div>` +
      `<div><label for="menu${i}"></label><select id="menu${i}" name="menu${i}"></select></div>`;
    row.querySelector(`label[for="name${i}"]`).textContent = dict.f_guest_name(i);
    row.querySelector(`label[for="menu${i}"]`).textContent = dict.f_guest_menu(i);
    const sel = row.querySelector("select");
    menus.forEach(([value, key]) => sel.add(new Option(dict[key], value)));
    if (saved["name" + i] != null) row.querySelector("input").value = saved["name" + i];
    if (saved["menu" + i] != null) sel.value = saved["menu" + i];
    box.appendChild(row);
  }
  box.style.display = n > 1 ? "" : "none";
}
form.addEventListener("change", e => {
  if (e.target.name === "teilnahme" || e.target.name === "personen") renderGuests();
});

function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = "block";
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const dict = T[current];
  const btn = form.querySelector('button[type="submit"]');
  errEl.style.display = "none";

  if (form.website.value) return;                     // Bot erkannt → nichts senden
  if (!CONFIG.RSVP_URL) { showError(dict.err_config); return; }

  const ja = form.teilnahme.value === "ja";
  const n = ja ? parseInt(form.personen.value, 10) : 0;
  const data = new URLSearchParams({
    vorname:   form.vorname.value.trim(),
    nachname:  form.nachname.value.trim(),
    telefon:   form.telefon.value.trim(),
    teilnahme: ja ? "Ja" : "Nein",
    personen:  String(n),
    menu:      ja ? form.menu.value : "",
    allergien: ja ? form.allergien.value.trim() : "",
    nachricht: form.nachricht.value.trim(),
    sprache:   current,
    einladung: CONFIG.INVITE,
    website:   form.website.value
  });
  for (let i = 2; i <= MAX_PERSONS; i++) {
    const nameEl = form.elements["name" + i], menuEl = form.elements["menu" + i];
    data.set("name" + i, i <= n && nameEl ? nameEl.value.trim() : "");
    data.set("menu" + i, i <= n && menuEl ? menuEl.value : "");
  }

  btn.disabled = true;
  btn.textContent = dict.sending;
  try {
    // "no-cors": Google Apps Script nimmt die Daten an; die Antwort ist nicht lesbar,
    // aber ein Netzwerkfehler würde hier eine Exception auslösen.
    await fetch(CONFIG.RSVP_URL, { method: "POST", mode: "no-cors", body: data });
    const name = form.vorname.value.trim();
    document.getElementById("thanks-text").textContent = ja ? dict.thanks_yes(name) : dict.thanks_no(name);
    form.style.display = "none";
    document.getElementById("thanks").style.display = "block";
  } catch (err) {
    showError(dict.err_send);
  } finally {
    btn.disabled = false;
    btn.textContent = dict.f_submit;
  }
});

// Sanftes Einblenden beim Scrollen
const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); } });
}, { threshold: 0.15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
<script id="fable-js">
// ===== Fable-Schicht: Eröffnung, Blütenblätter, Scroll-Details =====
(function () {
  const root = document.documentElement;
  const animate = root.classList.contains("fable-js");
  const SPRIG = '<svg class="sprig" viewBox="0 0 120 26" aria-hidden="true">' +
    '<path pathLength="1" d="M6 13 C 35 8, 85 18, 114 13"/>' +
    '<path class="leaf" pathLength="1" d="M26 11.5 q5-9 13-7 q-3 8-13 7z"/><path class="leaf" pathLength="1" d="M40 13 q6 8 13 5 q-4-7-13-5z"/>' +
    '<path class="leaf" pathLength="1" d="M56 12.5 q5-9 13-7 q-3 8-13 7z"/><path class="leaf" pathLength="1" d="M70 14.5 q6 8 13 5 q-4-7-13-5z"/>' +
    '<path class="leaf" pathLength="1" d="M86 14 q5-9 13-7 q-3 8-13 7z"/></svg>';
  document.querySelectorAll(".section-title").forEach(t => t.insertAdjacentHTML("afterbegin", SPRIG));

  // Lesefortschritt + wachsende Linie im Ablauf
  const bar = document.createElement("div"); bar.className = "f-progress"; document.body.appendChild(bar);
  const tl = document.querySelector(".timeline");
  const tlp = document.createElement("div"); tlp.className = "timeline-progress"; tl.appendChild(tlp);
  const events = [...tl.querySelectorAll(".event")];
  let ticking = false;
  function onScroll() {
    ticking = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, scrollY / max) : 0) + ")";
    const r = tl.getBoundingClientRect(), mid = innerHeight * 0.62;
    tlp.style.transform = "scaleY(" + Math.max(0, Math.min(1, (mid - r.top) / r.height)) + ")";
    events.forEach(ev => ev.classList.toggle("passed", ev.getBoundingClientRect().top + 28 < mid));
  }
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  addEventListener("resize", onScroll); onScroll();

  if (!animate) return;

  const COLORS = ["#b89a5e", "#d9c7a0", "#7f9a88", "#ead9b8", "#c9b48a"];
  function petal(x, p) {
    x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.globalAlpha = p.o; x.fillStyle = p.c;
    x.beginPath(); x.moveTo(0, -p.r); x.quadraticCurveTo(p.r * .9, 0, 0, p.r); x.quadraticCurveTo(-p.r * .9, 0, 0, -p.r); x.fill(); x.restore();
  }

  // Sanft fallende Blütenblätter im Startbereich
  function startPetals() {
    const hero = document.querySelector(".hero"); if (!hero || hero.querySelector(".petals")) return;
    const c = document.createElement("canvas"); c.className = "petals"; hero.prepend(c);
    const x = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2); let w = 0, h = 0;
    function size() { w = hero.clientWidth; h = hero.clientHeight; c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0); }
    size(); addEventListener("resize", size);
    const mk = init => ({ x: Math.random() * w, y: init ? Math.random() * h : -20, r: 4 + Math.random() * 6, vy: .18 + Math.random() * .4,
      vx: -.12 + Math.random() * .24, a: Math.random() * 6.28, va: (Math.random() - .5) * .012, ph: Math.random() * 6.28,
      c: COLORS[Math.floor(Math.random() * COLORS.length)], o: .22 + Math.random() * .38 });
    const P = Array.from({ length: w < 700 ? 14 : 30 }, () => mk(true));
    let visible = true, raf = 0;
    function tick(t) {
      raf = 0; x.clearRect(0, 0, w, h);
      for (const p of P) {
        p.y += p.vy; p.x += p.vx + Math.sin(t / 1800 + p.ph) * .25; p.a += p.va;
        if (p.y > h + 20) Object.assign(p, mk(false));
        petal(x, p);
      }
      loop();
    }
    function loop() { if (visible && !document.hidden && !raf) raf = requestAnimationFrame(tick); }
    new IntersectionObserver(e => { visible = e[0].isIntersecting; loop(); }).observe(hero);
    document.addEventListener("visibilitychange", loop); loop();
  }

  // Goldener Blütenregen nach einer Zusage
  function burst() {
    const c = document.createElement("canvas"); c.className = "f-burst"; document.body.appendChild(c);
    const x = c.getContext("2d"), dpr = Math.min(devicePixelRatio || 1, 2), w = innerWidth, h = innerHeight;
    c.width = w * dpr; c.height = h * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
    const P = Array.from({ length: 90 }, () => ({ x: w / 2 + (Math.random() - .5) * w * .5, y: h * .55, r: 4 + Math.random() * 6,
      vx: (Math.random() - .5) * 9, vy: -6 - Math.random() * 9, a: Math.random() * 6.28, va: (Math.random() - .5) * .2,
      c: COLORS[Math.floor(Math.random() * COLORS.length)], o: .9 }));
    const t0 = performance.now();
    (function tick(t) {
      const age = (t - t0) / 1000; x.clearRect(0, 0, w, h);
      for (const p of P) { p.vy += .16; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va; p.o = Math.max(0, .9 - age / 4.5); petal(x, p); }
      if (age < 4.5) requestAnimationFrame(tick); else c.remove();
    })(t0);
  }
  const thanks = document.getElementById("thanks");
  new MutationObserver(() => {
    const yes = document.querySelector('input[name="teilnahme"]:checked');
    if (thanks.style.display === "block" && yes && yes.value === "ja") burst();
  }).observe(thanks, { attributes: true, attributeFilter: ["style"] });

  // Nach dem Öffnen: Foto, Namen und Countdown erscheinen nacheinander
  function go() { root.classList.add("fable-go"); startPetals(); }
  function intro() { setTimeout(go, 350); }
  if (root.classList.contains("locked")) {
    new MutationObserver((m, o) => { if (!root.classList.contains("locked")) { o.disconnect(); intro(); } })
      .observe(root, { attributes: true, attributeFilter: ["class"] });
  } else intro();
})();
</script>
