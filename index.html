<title>Maria &amp; Aleksandar · Hochzeit</title>
<script>
  /* =====================================================================
     EINSTELLUNGEN: nur diese zwei Werte anpassen
     RSVP_URL    : Web-App-URL aus Google Apps Script (endet auf /exec)
     ACCESS_CODE : Zugangscode für die Seite, z. B. "belvoir27".
                   Leer lassen ("") = Seite ohne Code erreichbar.
     ===================================================================== */
  const CONFIG = {
    RSVP_URL: "https://script.google.com/macros/s/AKfycbzhe30P814RAzgGNfYU9LpVw0YKqgtzZquGvNoEktKeVGDTZHmMpdajAg6x7xUAgqQ/exec",
    ACCESS_CODE: "love2027"
  };

  // Zugangscode prüfen (aus Link ?code=… oder bereits früher eingegeben)
  (function () {
    if (!CONFIG.ACCESS_CODE) return;
    const norm = s => String(s || "").trim().toLowerCase();
    const code = norm(CONFIG.ACCESS_CODE);
    let ok = false;
    try {
      if (norm(new URLSearchParams(location.search).get("code")) === code) ok = true;
    } catch (e) {}
    try {
      if (ok) localStorage.setItem("wedding_access", code);
      else if (localStorage.getItem("wedding_access") === code) ok = true;
    } catch (e) {}
    if (!ok) document.documentElement.classList.add("locked");
  })();
</script>

<style>
  :root {
    --cream: #faf6ef;
    --paper: #fffdf9;
    --ink: #1f2724;
    --muted: #47524d;
    --sage: #7f9a88;
    --sage-dark: #4a6354;
    --gold: #b89a5e;
    --gold-text: #8a6d35;   /* dunkleres Gold für Schrift */
    --line: #e6dccb;
    --serif: "Cormorant Garamond", Georgia, serif;
    --script: "Great Vibes", cursive;
    --sans: "Jost", system-ui, sans-serif;
  }
  /* Aramäisch (syrische Schrift) */
  html[lang="syr"] {
    --serif: "Noto Sans Syriac", "Cormorant Garamond", serif;
    --sans: "Noto Sans Syriac", "Jost", sans-serif;
  }
  html[lang="syr"] .script { font-family: "Noto Sans Syriac", serif !important; font-size: 1.9rem !important; line-height: 1.6 !important; }
  html[lang="syr"] body { line-height: 2; }
  html[lang="syr"] nav, html[lang="syr"] label, html[lang="syr"] .btn, html[lang="syr"] .eyebrow,
  html[lang="syr"] .countdown small { letter-spacing: 0; text-transform: none; }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--cream);
    color: var(--ink);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 1.06rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }

  /* ---------- Navigation ---------- */
  nav {
    position: fixed; inset: 0 0 auto 0; z-index: 10;
    display: flex; justify-content: center; align-items: center; gap: 1.8rem; flex-wrap: wrap;
    padding: .9rem 1rem;
    background: rgba(250, 246, 239, 0.88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    font-size: 0.86rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase;
  }
  nav a { text-decoration: none; color: var(--muted); transition: color .2s; }
  nav a:hover { color: var(--sage-dark); }
  .lang-switch { display: flex; gap: .3rem; padding-inline-start: 1.2rem; border-inline-start: 1px solid var(--line); }
  .lang-switch button {
    background: none; border: 1px solid transparent; border-radius: 999px;
    padding: .2rem .6rem; cursor: pointer; color: var(--muted);
    font-family: "Jost", "Noto Sans Syriac", sans-serif; font-size: .78rem; letter-spacing: .08em;
  }
  .lang-switch button[aria-pressed="true"] { border-color: var(--sage-dark); color: var(--sage-dark); }

  /* ---------- Hero ---------- */
  .hero {
    min-height: 100vh; display: grid; place-items: center; text-align: center;
    padding: 7rem 1.5rem 4rem; position: relative; overflow: hidden;
  }
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%;
    background: radial-gradient(circle, rgba(127,154,136,.18), transparent 70%);
    width: 520px; height: 520px;
  }
  .hero::before { top: -160px; left: -160px; }
  .hero::after  { bottom: -180px; right: -160px; background: radial-gradient(circle, rgba(184,154,94,.16), transparent 70%); }
  .hero-inner { position: relative; z-index: 1; max-width: 720px; }
  .eyebrow { font-size: 0.92rem; font-weight: 500; letter-spacing: 0.3em; text-transform: uppercase; color: var(--sage-dark); margin-bottom: 1.5rem; }
  .names {
    font-family: "Great Vibes", cursive;
    font-size: clamp(3.2rem, 11.5vw, 7rem);
    line-height: 1.1; font-weight: 400; color: var(--ink);
    direction: ltr; unicode-bidi: isolate;
  }
  .names .amp { color: var(--gold-text); font-size: .7em; display: inline-block; margin: 0 .15em; }
  .divider { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 2rem auto; color: var(--gold); }
  .divider::before, .divider::after { content: ""; height: 1px; width: 70px; background: var(--gold); opacity: .6; }
  .date-line { font-family: var(--serif); font-size: clamp(1.3rem, 4vw, 1.75rem); letter-spacing: .06em; }
  .place-line { color: var(--muted); margin-top: .3rem; letter-spacing: .03em; font-size: 1.08rem; }

  .countdown { display: flex; justify-content: center; gap: clamp(.75rem, 4vw, 2rem); margin-top: 3rem; direction: ltr; }
  .countdown div { min-width: 64px; }
  .countdown span { display: block; font-family: "Cormorant Garamond", serif; font-size: clamp(2rem, 7vw, 2.8rem); font-weight: 500; line-height: 1; }
  .countdown small { font-size: .8rem; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .btn {
    display: inline-block; margin-top: 3rem; padding: .9rem 2.4rem;
    border: 1px solid var(--sage-dark); border-radius: 999px;
    color: var(--sage-dark); text-decoration: none;
    font-size: .9rem; font-weight: 500; letter-spacing: .2em; text-transform: uppercase;
    background: transparent; cursor: pointer; font-family: var(--sans); transition: all .25s;
  }
  .btn:hover, .btn.solid { background: var(--sage-dark); color: #fff; }
  .btn.solid:hover { background: var(--ink); border-color: var(--ink); }

  /* ---------- Sections ---------- */
  section.block { padding: 6rem 1.5rem; }
  section.alt { background: var(--paper); border-block: 1px solid var(--line); }
  .container { max-width: 960px; margin: 0 auto; }
  .section-title { text-align: center; margin-bottom: 3.5rem; }
  .section-title .script { font-family: var(--script); font-size: 2.9rem; color: var(--gold-text); line-height: 1.15; }
  .section-title h2 { font-family: var(--serif); font-weight: 600; font-size: clamp(2rem, 5vw, 2.8rem); letter-spacing: .04em; }
  .lead { font-family: var(--serif); font-size: 1.55rem; font-weight: 500; font-style: italic; text-align: center; max-width: 640px; margin: 0 auto; }
  html[lang="syr"] .lead { font-style: normal; font-size: 1.25rem; }

  /* ---------- Timeline ---------- */
  .timeline { position: relative; max-width: 640px; margin: 0 auto; }
  .timeline::before { content: ""; position: absolute; inset-inline-start: 92px; top: 6px; bottom: 6px; width: 1px; background: var(--line); }
  .event { display: grid; grid-template-columns: 80px 1fr; gap: 2.5rem; padding: 1.1rem 0; position: relative; }
  .event::before {
    content: ""; position: absolute; inset-inline-start: 88px; top: 1.65rem;
    width: 9px; height: 9px; border-radius: 50%; background: var(--cream); border: 1px solid var(--gold);
  }
  .event time { font-family: "Cormorant Garamond", serif; font-size: 1.35rem; font-weight: 600; text-align: end; color: var(--sage-dark); }
  .event h3 { font-family: var(--serif); font-weight: 600; font-size: 1.5rem; }
  .event p { color: var(--muted); font-size: 1.04rem; }

  /* ---------- Cards ---------- */
  .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 1.5rem; }
  .cards > .card { flex: 1 1 260px; max-width: 304px; }
  .card { background: var(--cream); border: 1px solid var(--line); border-radius: 4px; padding: 2.2rem 1.8rem; text-align: center; }
  .card.highlight { border-color: var(--gold); }
  .card .icon { font-size: 1.6rem; color: var(--gold); margin-bottom: .8rem; height: 2rem; display: flex; align-items: center; justify-content: center; }
  .ico { width: 1.7rem; height: 1.7rem; display: block; }
  .card h3 { font-family: var(--serif); font-weight: 600; font-size: 1.55rem; margin-bottom: .5rem; }
  .card p { color: var(--muted); font-size: 1.04rem; }
  .card a.link { display: inline-block; margin-top: 1rem; color: var(--sage-dark); font-size: .9rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; text-decoration: none; border-bottom: 1px solid currentColor; }
  html[lang="syr"] .card a.link { letter-spacing: 0; }

  /* ---------- RSVP ---------- */
  form { max-width: 560px; margin: 0 auto; display: grid; gap: 1.3rem; }
  label { font-size: .84rem; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: block; margin-bottom: .4rem; }
  input, select, textarea {
    width: 100%; padding: .85rem 1rem;
    font-family: var(--sans); font-size: 1.05rem; font-weight: 400; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 3px; transition: border-color .2s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--sage); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .choice { display: flex; gap: 1rem; }
  .choice label {
    flex: 1; text-transform: none; letter-spacing: 0; font-size: 1rem; color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px; padding: .85rem 1rem;
    display: flex; align-items: center; gap: .6rem; cursor: pointer; margin: 0; background: var(--paper);
  }
  .choice input { width: auto; accent-color: var(--sage-dark); }
  .hint { font-size: .95rem; color: var(--muted); margin-top: .35rem; }
  .center { text-align: center; }
  .thanks { display: none; text-align: center; max-width: 520px; margin: 0 auto; padding: 3rem 2rem; border: 1px solid var(--line); background: var(--paper); }
  .thanks .script { font-family: var(--script); font-size: 3rem; color: var(--gold-text); }
  .deadline { text-align: center; color: var(--muted); margin-top: -2rem; margin-bottom: 2.5rem; }
  #attend-details, #guests { display: grid; gap: 1.3rem; }

  /* ---------- Foto ---------- */
  .photo { max-width: 400px; margin: 0 auto 3rem; padding: 10px; background: var(--cream); border: 1px solid var(--line);
           border-radius: 210px 210px 8px 8px; box-shadow: 0 18px 40px -24px rgba(47,58,54,.35); }
  .photo img { display: block; width: 100%; height: auto; border-radius: 200px 200px 4px 4px; }

  /* ---------- Mitwirkende ---------- */
  .times-note { text-align: center; color: var(--muted); font-size: .98rem; margin-top: 1.5rem; }
  .crew-title { margin-top: 5rem; }
  .crew .card { background: var(--paper); }
  .hp { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; opacity: 0; pointer-events: none; }
  form { position: relative; }
  .form-error { display: none; text-align: center; color: #a5483a; font-size: .95rem; }
  .btn[disabled] { opacity: .6; cursor: wait; }

  /* ---------- Zugangscode ---------- */
  .gate { display: none; min-height: 100vh; place-items: center; padding: 1.5rem; text-align: center; }
  html.locked .gate { display: grid; }
  html.locked body > :not(.gate) { display: none !important; }
  .gate-box { max-width: 420px; width: 100%; }
  .gate .names { font-size: clamp(2.8rem, 10vw, 4.5rem); }
  .gate p { color: var(--muted); margin: 1.2rem 0 1.5rem; }
  .gate form { gap: 0; }
  .gate input { text-align: center; letter-spacing: .1em; }
  .gate .btn { margin-top: 1.2rem; }
  .gate-error { color: #a5483a; font-size: .9rem; margin-top: .8rem; min-height: 1.4em; }
  .gate .lang-switch { justify-content: center; border: 0; padding: 0; margin-top: 2rem; }

  /* ---------- FAQ ---------- */
  details { border-bottom: 1px solid var(--line); padding: 1.2rem 0; max-width: 700px; margin: 0 auto; }
  summary { font-family: var(--serif); font-weight: 600; font-size: 1.4rem; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "+"; color: var(--gold-text); font-size: 1.6rem; transition: transform .2s; }
  details[open] summary::after { transform: rotate(45deg); }
  details p { color: var(--muted); padding-top: .6rem; }

  /* ---------- Footer ---------- */
  footer { text-align: center; padding: 4rem 1.5rem; }
  footer .names { font-size: 3rem; }
  footer p { color: var(--muted); font-size: .95rem; letter-spacing: .15em; margin-top: .5rem; direction: ltr; }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .9s ease, transform .9s ease; }
  .reveal.visible { opacity: 1; transform: none; }

  @media (max-width: 640px) {
    nav { gap: .9rem; font-size: .74rem; letter-spacing: .08em; }
    .lang-switch { padding-inline-start: 0; border-inline-start: 0; width: 100%; justify-content: center; }
    .hero { padding-top: 8.5rem; }
    .row { grid-template-columns: 1fr; }
    .cards > .card { max-width: none; }
    .choice { flex-direction: column; }
    .timeline::before { inset-inline-start: 66px; }
    .event { grid-template-columns: 56px 1fr; gap: 2rem; }
    .event::before { inset-inline-start: 62px; }
    .event time { font-size: 1.2rem; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    html { scroll-behavior: auto; }
  }
</style>
</head>

    q1: "ܡܨܝܢ ܛܠܝ̈ܐ ܕܢܐܬܘܢ؟",
    a1: "ܡܫܬܘܬܐ ܠܙ̈ܡܝܢܐ ܕܡܢ 16 ܫ̈ܢܝܢ ܘܠܥܠ ܗܝ، ܘܠܐܝܠܝܢ ܕܩܒܠܘ ܗܕܐ ܩܪܝܬܐ. ܬܘܕܝ ܥܠ ܦܘܪܫܢܟܘܢ.",
    q2: "ܡܢܐ ܨܒܝܢ ܐܢܬܘܢ ܡܘܗܒܬܐ؟",
    a2: "ܡܘܗܒܬܐ ܪܒܬܐ ܗܝ ܐܝܬܘܬܟܘܢ ܥܡܢ.",
    q3: "ܡܨܝܢܢ ܕܢܨܘܪ ܨܘ̈ܪܬܐ ܒܥܕܬܐ؟",
    a3: "ܒܥܝܢܢ ܡܢܟܘܢ ܕܠܐ ܬܨܘܪܘܢ ܒܥܕܬܐ. Image Studio ܢܨܘܪܘܢ ܟܠ ܡܕܡ. ܡܢ ܩܘܒܠܐ ܘܠܗܠ ܫܠܝܛ.",
    q4: "ܠܡܢ ܡܨܐ ܐܢܐ ܕܐܫܐܠ؟",
    a4: "ܟܬܘܒܘ ܠܢ ܒ‑<span dir=\"ltr\">WhatsApp</span>."
  }
};

const META = { de: { lang: "de", dir: "ltr" }, sr: { lang: "sr-Cyrl", dir: "ltr" }, syr: { lang: "syr", dir: "rtl" } };
let current = "de";

function setLang(code) {
  if (!T[code]) code = "de";
  current = code;
  const dict = T[code];
  document.documentElement.lang = META[code].lang === "syr" ? "syr" : META[code].lang;
  document.documentElement.dir = META[code].dir;
  document.title = dict._title;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const v = dict[el.dataset.i18n];
    if (typeof v === "string") el.innerHTML = v;
  });
  document.querySelectorAll(".lang-switch button").forEach(b =>
    b.setAttribute("aria-pressed", b.dataset.lang === code ? "true" : "false"));
  renderGuests();
  try {
    const url = new URL(location.href);
    url.searchParams.set("lang", code);
    history.replaceState(null, "", url);
  } catch (e) {}
}

document.querySelectorAll(".lang-switch button").forEach(b =>
  b.addEventListener("click", () => setLang(b.dataset.lang)));

// Sprache aus Link übernehmen, z. B. ...?lang=sr oder ?lang=syr
let initial = "de";
try { initial = new URLSearchParams(location.search).get("lang") || "de"; } catch (e) {}
setLang(initial);

// Countdown bis zur Trauung
const target = new Date("2027-08-21T15:00:00+02:00").getTime();
const pad = n => String(n).padStart(2, "0");
function tick() {
  let diff = Math.max(0, target - Date.now());
  const d = Math.floor(diff / 86400000); diff %= 86400000;
  const h = Math.floor(diff / 3600000);  diff %= 3600000;
  const m = Math.floor(diff / 60000);    diff %= 60000;
  const s = Math.floor(diff / 1000);
  document.getElementById("cd-days").textContent = d;
  document.getElementById("cd-hours").textContent = pad(h);
  document.getElementById("cd-mins").textContent = pad(m);
  document.getElementById("cd-secs").textContent = pad(s);
}
tick(); setInterval(tick, 1000);

// Zugangscode-Formular
document.getElementById("gate-form").addEventListener("submit", e => {
  e.preventDefault();
  const norm = s => String(s || "").trim().toLowerCase();
  const input = document.getElementById("gate-code");
  if (norm(input.value) === norm(CONFIG.ACCESS_CODE)) {
    try { localStorage.setItem("wedding_access", norm(CONFIG.ACCESS_CODE)); } catch (err) {}
    document.documentElement.classList.remove("locked");
    window.scrollTo(0, 0);
  } else {
    document.getElementById("gate-error").textContent = T[current].gate_wrong;
    input.select();
  }
});

// ---------- Zusage-Formular ----------
const MAX_PERSONS = 6;
const form = document.getElementById("rsvp-form");
const errEl = document.getElementById("form-error");

// Erzeugt Name- und Menüfelder für Person 2 bis N (bleibt beim Sprachwechsel erhalten)
function renderGuests() {
  const f = document.getElementById("rsvp-form");
  const box = document.getElementById("guests");
  const dict = T[current];
  const attends = f.elements.teilnahme.value !== "nein";
  document.getElementById("attend-details").style.display = attends ? "" : "none";
  const n = attends ? parseInt(f.elements.personen.value, 10) : 1;

  const saved = {};
  box.querySelectorAll("input, select").forEach(el => { saved[el.name] = el.value; });
  box.innerHTML = "";
  const menus = [["Fleisch", "m_meat"], ["Fisch", "m_fish"], ["Vegetarisch", "m_veg"], ["Vegan", "m_vegan"]];

  for (let i = 2; i <= n; i++) {
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      `<div><label for="name${i}"></label><input id="name${i}" name="name${i}" required></div>` +
      `<div><label for="menu${i}"></label><select id="menu${i}" name="menu${i}"></select></div>`;
    row.querySelector(`label[for="name${i}"]`).textContent = dict.f_guest_name(i);
    row.querySelector(`label[for="menu${i}"]`).textContent = dict.f_guest_menu(i);
    const sel = row.querySelector("select");
    menus.forEach(([value, key]) => sel.add(new Option(dict[key], value)));
    if (saved["name" + i] != null) row.querySelector("input").value = saved["name" + i];
    if (saved["menu" + i] != null) sel.value = saved["menu" + i];
    box.appendChild(row);
  }
  box.style.display = n > 1 ? "" : "none";
}
form.addEventListener("change", e => {
  if (e.target.name === "teilnahme" || e.target.name === "personen") renderGuests();
});

function showError(msg) {
  errEl.textContent = msg;
  errEl.style.display = "block";
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const dict = T[current];
  const btn = form.querySelector('button[type="submit"]');
  errEl.style.display = "none";

  if (form.website.value) return;                     // Bot erkannt → nichts senden
  if (!CONFIG.RSVP_URL) { showError(dict.err_config); return; }

  const ja = form.teilnahme.value === "ja";
  const n = ja ? parseInt(form.personen.value, 10) : 0;
  const data = new URLSearchParams({
    vorname:   form.vorname.value.trim(),
    nachname:  form.nachname.value.trim(),
    telefon:   form.telefon.value.trim(),
    teilnahme: ja ? "Ja" : "Nein",
    personen:  String(n),
    menu:      ja ? form.menu.value : "",
    allergien: ja ? form.allergien.value.trim() : "",
    nachricht: form.nachricht.value.trim(),
    sprache:   current,
    website:   form.website.value
  });
  for (let i = 2; i <= MAX_PERSONS; i++) {
    const nameEl = form.elements["name" + i], menuEl = form.elements["menu" + i];
    data.set("name" + i, i <= n && nameEl ? nameEl.value.trim() : "");
    data.set("menu" + i, i <= n && menuEl ? menuEl.value : "");
  }

  btn.disabled = true;
  btn.textContent = dict.sending;
  try {
    // "no-cors": Google Apps Script nimmt die Daten an; die Antwort ist nicht lesbar,
    // aber ein Netzwerkfehler würde hier eine Exception auslösen.
    await fetch(CONFIG.RSVP_URL, { method: "POST", mode: "no-cors", body: data });
    const name = form.vorname.value.trim();
    document.getElementById("thanks-text").textContent = ja ? dict.thanks_yes(name) : dict.thanks_no(name);
    form.style.display = "none";
    document.getElementById("thanks").style.display = "block";
  } catch (err) {
    showError(dict.err_send);
  } finally {
    btn.disabled = false;
    btn.textContent = dict.f_submit;
  }
});

// Sanftes Einblenden beim Scrollen
const io = new IntersectionObserver(entries => {
  entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("visible"); io.unobserve(en.target); } });
}, { threshold: 0.15 });
document.querySelectorAll(".reveal").forEach(el => io.observe(el));
</script>
</body>
</html>
